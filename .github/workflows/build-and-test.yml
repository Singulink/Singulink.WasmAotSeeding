name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Auto-cancel any old in-progress runs for the same PR, but not for non-PR runs
concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # The package tests build mock apps with the package, as its users do on Windows, Linux and macOS. No test needs a WebAssembly workload: the AOT
  # compilation is mocked, and only a real AOT publish of an app runs it. On arm64 (macOS), the test of the escaped non-ASCII wrapper name is
  # inconclusive: the AOT compiler escapes as signed chars only on x64 build machines.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
        include:
        - os: windows-latest
          platform: windows-x64
        - os: ubuntu-latest
          platform: linux-x64
        - os: macos-latest
          platform: macos-arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Clean
      run: dotnet clean Singulink.WasmAotSeeding.slnx --configuration ${{ matrix.configuration }}
    - name: Install dependencies
      run: dotnet restore Singulink.WasmAotSeeding.slnx
    - name: Build
      run: dotnet build Singulink.WasmAotSeeding.slnx --configuration ${{ matrix.configuration }} --no-restore
    - name: Test
      run: dotnet test Singulink.WasmAotSeeding.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal
